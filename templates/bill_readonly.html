{{template "base" .}}
{{define "title"}}{{.Title}}{{end}}

{{define "nav"}}
<nav class="editor-nav readonly-nav">
  <div class="control-row">
    <span class="readonly-badge"><i class="bi bi-eye"></i> Read only</span>
    <span class="rule-cite">
      Last edited {{Time .Document.LastModified}}
      {{if .Document.Owner}}by {{.Document.Owner}}{{end}}
    </span>
    <div class="control-right">
      {{if .User.SignedIn}}
      <a class="btn btn-sm btn-outline-secondary" href="/">Drafts</a>
      {{else}}
      <a class="btn btn-sm btn-outline-secondary" href="/sign_in">Sign in</a>
      {{end}}
    </div>
  </div>
</nav>
{{end}}

{{define "middle"}}
<div class="editor-layout readonly">
  <div class="editor-paper">
    {{.Bill}}
  </div>
</div>
{{end}}
